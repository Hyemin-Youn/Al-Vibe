<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: base(~{::content})}">
<head><title>알바이브 - 접근 권한이 없습니다</title></head>
<body>
<th:block th:fragment="content">
    <div class="container py-5 text-center">
        <div class="py-5">
            <div style="font-size:80px;font-weight:700;color:#ea580c">403</div>
            <h3 class="fw-bold mb-3">접근 권한이 없습니다</h3>
            <p class="text-muted mb-4">해당 페이지에 접근할 수 있는 권한이 없습니다.<br><span id="countdown">5</span>초 후 질문 목록으로 이동합니다.</p>
            <a href="/questions/list" class="btn btn-primary px-4">질문 목록으로 돌아가기</a>
        </div>
    </div>
    <script>
        let count = 5;
        const el = document.getElementById('countdown');
        const timer = setInterval(() => {
            count--;
            el.textContent = count;
            if (count <= 0) { clearInterval(timer); location.href = '/questions/list'; }
        }, 1000);
    </script>
</th:block>
</body>
</html>
