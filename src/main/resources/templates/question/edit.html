<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:replace="~{layout/base :: base(~{::content})}">
<head><title>알바이브 - 질문 수정</title></head>
<body>
<th:block th:fragment="content">
  <div class="container py-4" style="max-width:720px">
    <div style="font-size:20px;font-weight:600;margin-bottom:20px">질문 수정</div>
    <div class="card p-4">
      <form th:action="@{'/questions/edit/' + ${questionId}}" th:object="${questionFormDto}" method="post">
        <div class="mb-3">
          <label class="form-label fw-semibold">카테고리 <span style="color:#ea580c">*</span></label>
          <select th:field="*{categoryId}" class="form-select" th:errorclass="is-invalid">
            <option value="">카테고리를 선택해주세요</option>
            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
          </select>
          <div class="invalid-feedback" th:errors="*{categoryId}"></div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">제목 <span style="color:#ea580c">*</span></label>
          <input type="text" th:field="*{title}" class="form-control" th:errorclass="is-invalid">
          <div class="invalid-feedback" th:errors="*{title}"></div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">내용 <span style="color:#ea580c">*</span></label>
          <textarea th:field="*{content}" class="form-control" th:errorclass="is-invalid" rows="12"></textarea>
          <div class="invalid-feedback" th:errors="*{content}"></div>
        </div>
        <hr>
        <div class="d-flex justify-content-end gap-2">
          <a th:href="@{'/questions/detail/' + ${questionId}}" class="btn btn-outline-secondary">취소</a>
          <button type="submit" class="btn btn-primary">수정 완료</button>
        </div>
      </form>
    </div>
  </div>
</th:block>
</body>
</html>
