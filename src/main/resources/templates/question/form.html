<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>질문 작성</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4" style="max-width: 720px;">
    <h2>질문 작성</h2>

    <form th:action="@{/questions/new}" th:object="${questionFormDto}" method="post" class="mt-4">

        <div class="mb-3">
            <label for="categoryId" class="form-label">카테고리</label>
            <select th:field="*{categoryId}" id="categoryId"
                    class="form-select"
                    th:errorclass="is-invalid">
                <option value="">-- 카테고리 선택 --</option>
                <option th:each="cat : ${categories}"
                        th:value="${cat.id}"
                        th:text="${cat.name}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{categoryId}"></div>
        </div>

        <div class="mb-3">
            <label for="title" class="form-label">제목</label>
            <input type="text" th:field="*{title}" id="title"
                   class="form-control"
                   th:errorclass="is-invalid"
                   placeholder="제목을 입력하세요">
            <div class="invalid-feedback" th:errors="*{title}"></div>
        </div>

        <div class="mb-3">
            <label for="content" class="form-label">내용</label>
            <textarea th:field="*{content}" id="content"
                      class="form-control"
                      th:errorclass="is-invalid"
                      rows="10"
                      placeholder="내용을 입력하세요"></textarea>
            <div class="invalid-feedback" th:errors="*{content}"></div>
        </div>

        <div class="d-flex justify-content-end gap-2">
            <a href="/questions/list" class="btn btn-outline-secondary">취소</a>
            <button type="submit" class="btn btn-primary">등록</button>
        </div>
    </form>
</div>
</body>
</html>
