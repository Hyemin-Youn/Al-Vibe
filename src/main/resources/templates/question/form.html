<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:replace="~{layout/base :: base(~{::content})}">
<head><title>알바이브 - 질문 작성</title></head>
<body>
<th:block th:fragment="content">
    <div class="container py-4" style="max-width:720px">
        <div style="margin-bottom:20px">
            <div style="font-size:20px;font-weight:600">질문 작성</div>
            <div style="font-size:13px;color:#9ca3af;margin-top:4px">구체적으로 작성할수록 더 좋은 답변을 받을 수 있어요</div>
        </div>

        <div class="card p-4">
            <form th:action="@{/questions/new}" th:object="${questionFormDto}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold">카테고리 <span style="color:#ea580c">*</span></label>
                    <select th:field="*{categoryId}" class="form-select" th:errorclass="is-invalid">
                        <option value="">카테고리를 선택해주세요</option>
                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{categoryId}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">제목 <span style="color:#ea580c">*</span></label>
                    <input type="text" th:field="*{title}" class="form-control"
                           th:errorclass="is-invalid" placeholder="질문 제목을 입력해주세요">
                    <div class="invalid-feedback" th:errors="*{title}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">내용 <span style="color:#ea580c">*</span></label>
                    <textarea th:field="*{content}" class="form-control"
                              th:errorclass="is-invalid" rows="12"
                              placeholder="질문 내용을 상세히 작성해주세요"></textarea>
                    <div class="invalid-feedback" th:errors="*{content}"></div>
                </div>

                <hr>
                <div class="d-flex justify-content-end gap-2">
                    <a href="/questions/list" class="btn btn-outline-secondary">취소</a>
                    <button type="submit" class="btn btn-primary">질문 등록</button>
                </div>
            </form>
        </div>
    </div>
</th:block>
</body>
</html>
