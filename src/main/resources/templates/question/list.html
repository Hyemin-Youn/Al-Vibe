<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:replace="~{layout/base :: base(~{::content})}">
<head><title>알바이브 - 질문 목록</title></head>
<body>
<th:block th:fragment="content">
    <div class="container py-4">

        <!-- 검색 히어로 -->
        <div class="text-center py-4 mb-4 rounded-3" style="background:#fff7ed;border:1px solid #fed7aa">
            <h4 class="fw-bold mb-3">알바 관련 무엇이든 물어보세요</h4>
            <form th:action="@{/questions/list}" method="get" class="d-flex justify-content-center gap-2">
                <input type="hidden" name="sort" th:value="${sort}">
                <input type="text" name="keyword" th:value="${keyword}"
                       class="form-control" style="width:400px" placeholder="검색어를 입력하세요">
                <button type="submit" class="btn btn-primary px-4">검색</button>
            </form>
        </div>

        <div class="row">
            <!-- 질문 목록 -->
            <div class="col-9">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="d-flex gap-2">
                        <a th:href="@{/questions/list(sort='latest',keyword=${keyword})}"
                           class="btn btn-sm" th:classappend="${sort == 'latest' or sort == null} ? 'btn-primary' : 'btn-outline-secondary'">최신순</a>
                        <a th:href="@{/questions/list(sort='view',keyword=${keyword})}"
                           class="btn btn-sm" th:classappend="${sort == 'view'} ? 'btn-primary' : 'btn-outline-secondary'">조회수순</a>
                    </div>
                    <a href="/questions/new" class="btn btn-primary btn-sm">+ 질문하기</a>
                </div>

                <div class="card">
                    <div class="card-body p-0">
                        <div th:each="q : ${questionPage.content}" class="p-3 border-bottom question-item">
                            <div class="d-flex gap-3">
                                <div class="d-flex flex-column align-items-center gap-1" style="min-width:60px">
                                    <div class="text-center rounded p-1" style="background:#f9fafb;border:1px solid #e5e7eb;font-size:12px">
                                        <div class="fw-bold" th:text="${q.answerCount ?: 0}" style="font-size:16px">0</div>
                                        <div class="text-muted">답변</div>
                                    </div>
                                    <div class="text-center rounded p-1" style="background:#f9fafb;border:1px solid #e5e7eb;font-size:12px">
                                        <div class="fw-bold" th:text="${q.viewCount}" style="font-size:16px">0</div>
                                        <div class="text-muted">조회</div>
                                    </div>
                                </div>
                                <div class="flex-grow-1">
                                    <div class="mb-1">
                    <span class="badge me-1" style="background:#fff7ed;color:#c2410c;border:1px solid #fed7aa"
                          th:text="${q.category.name}">카테고리</span>
                                    </div>
                                    <a th:href="@{'/questions/detail/' + ${q.id}}"
                                       th:text="${q.title}"
                                       class="text-decoration-none fw-semibold"
                                       style="color:#111827;font-size:15px"></a>
                                    <div class="text-muted mt-1" style="font-size:12px">
                                        <span th:text="${q.member.nickname}">작성자</span>
                                        <span class="ms-2" th:text="${#temporals.format(q.createdAt, 'yyyy.MM.dd')}">날짜</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div th:if="${#lists.isEmpty(questionPage.content)}" class="text-center text-muted py-5">
                            등록된 질문이 없습니다.
                        </div>
                    </div>
                </div>

                <!-- 페이징 -->
                <div class="mt-4 d-flex justify-content-center gap-1" th:if="${!#lists.isEmpty(questionPage.content)}">
                    <a th:if="${!questionPage.first}"
                       th:href="@{/questions/list(page=${questionPage.number - 1},keyword=${keyword},sort=${sort})}"
                       class="btn btn-sm btn-outline-secondary">이전</a>
                    <span th:each="i : ${#numbers.sequence(0, questionPage.totalPages - 1)}">
            <a th:href="@{/questions/list(page=${i},keyword=${keyword},sort=${sort})}"
               th:text="${i + 1}"
               class="btn btn-sm"
               th:classappend="${i == questionPage.number} ? 'btn-primary' : 'btn-outline-secondary'"></a>
          </span>
                    <a th:if="${!questionPage.last}"
                       th:href="@{/questions/list(page=${questionPage.number + 1},keyword=${keyword},sort=${sort})}"
                       class="btn btn-sm btn-outline-secondary">다음</a>
                </div>
            </div>

            <!-- 사이드바 -->
            <div class="col-3">
                <div class="card p-3 mb-3">
                    <h6 class="fw-bold mb-3">카테고리</h6>
                    <ul class="list-unstyled mb-0">
                        <li class="py-1 border-bottom"><a th:href="@{/questions/list}" class="text-decoration-none text-secondary">전체</a></li>
                        <li class="py-1 border-bottom"><a th:href="@{/questions/list(category='외식/음식점')}" class="text-decoration-none text-secondary">외식/음식점</a></li>
                        <li class="py-1 border-bottom"><a th:href="@{/questions/list(category='서비스/판매')}" class="text-decoration-none text-secondary">서비스/판매</a></li>
                        <li class="py-1 border-bottom"><a th:href="@{/questions/list(category='배달/운전/물류')}" class="text-decoration-none text-secondary">배달/운전/물류</a></li>
                        <li class="py-1 border-bottom"><a th:href="@{/questions/list(category='교육(학원)')}" class="text-decoration-none text-secondary">교육(학원)</a></li>
                        <li class="py-1 border-bottom"><a th:href="@{/questions/list(category='문화/여가')}" class="text-decoration-none text-secondary">문화/여가</a></li>
                        <li class="py-1 border-bottom"><a th:href="@{/questions/list(category='구합니다')}" class="text-decoration-none text-secondary">구합니다</a></li>
                        <li class="py-1"><a th:href="@{/questions/list(category='자유게시판')}" class="text-decoration-none text-secondary">자유게시판</a></li>
                    </ul>
                </div>
                <div class="card p-3" style="background:#fff7ed;border-color:#fed7aa">
                    <p class="fw-bold mb-2" style="color:#c2410c">첫 질문 작성하기</p>
                    <p class="small mb-3" style="color:#c2410c">궁금한 게 있으신가요?</p>
                    <a href="/questions/new" class="btn btn-primary btn-sm w-100">질문 작성하기</a>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
