<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:replace="~{layout/base :: base(~{::content})}">
<head><title th:text="${question.title}">질문 상세</title></head>
<body>
<th:block th:fragment="content">
    <div class="container py-4">
        <div class="row">
            <div class="col-9">

                <!-- 질문 본문 -->
                <div class="card p-4 mb-4">
                    <div class="mb-2">
            <span class="badge me-1" style="background:#fff7ed;color:#c2410c;border:1px solid #fed7aa"
                  th:text="${question.category.name}">카테고리</span>
                    </div>
                    <h3 class="fw-bold mb-2" th:text="${question.title}">제목</h3>
                    <div class="d-flex justify-content-between text-muted small border-bottom pb-2 mb-3">
                        <div>작성자: <strong th:text="${question.member.nickname}">닉네임</strong></div>
                        <div>
                            조회수 <span th:text="${question.viewCount}">0</span>
                            <span class="ms-3">작성일 <span th:text="${#temporals.format(question.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</span></span>
                        </div>
                    </div>
                    <div style="min-height:200px;white-space:pre-wrap;font-size:15px;line-height:1.8" th:text="${question.content}">내용</div>
                    <div class="d-flex justify-content-between mt-3">
                        <a href="/questions/list" class="btn btn-outline-secondary btn-sm">목록</a>
                        <span th:if="${isAuthor}">
                            <a th:href="@{'/questions/edit/' + ${question.id}}" class="btn btn-outline-primary btn-sm">수정</a>
                            <form th:action="@{'/questions/delete/' + ${question.id}}" method="post"
                                  onsubmit="return confirm('정말 삭제하시겠습니까?');" class="d-inline">
                                <button type="submit" class="btn btn-outline-danger btn-sm">삭제</button>
                            </form>
                        </span>
                        <button type="button" class="btn btn-outline-warning btn-sm"
                                th:if="${!isAuthor}" sec:authorize="isAuthenticated()"
                                data-bs-toggle="modal" data-bs-target="#questionReportModal">   <!-- ← 여기 -->
                            신고
                        </button>

                    </div>
                </div>

                <!-- 답변 영역 -->
                <div th:replace="~{answer/list :: answerSection}"></div>
                <th:block th:replace="~{answer/list :: answerScript}"></th:block>

            </div>
            <div class="col-3">
                <div class="card p-3">
                    <h6 class="fw-bold mb-3">카테고리</h6>
                    <ul class="list-unstyled mb-0">
                        <li class="py-1 border-bottom"><a th:href="@{/questions/list}" class="text-decoration-none text-secondary">전체</a></li>
                        <li class="py-1 border-bottom"><a th:href="@{/questions/list(category='외식/음식점')}" class="text-decoration-none text-secondary">외식/음식점</a></li>
                        <li class="py-1 border-bottom"><a th:href="@{/questions/list(category='서비스/판매')}" class="text-decoration-none text-secondary">서비스/판매</a></li>
                        <li class="py-1 border-bottom"><a th:href="@{/questions/list(category='배달/운전/물류')}" class="text-decoration-none text-secondary">배달/운전/물류</a></li>
                        <li class="py-1"><a th:href="@{/questions/list(category='교육(학원)')}" class="text-decoration-none text-secondary">교육(학원)</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="questionReportModal" tabindex="-1"
         th:unless="${isAuthor}" sec:authorize="isAuthenticated()">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">질문 신고</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form th:action="@{'/questions/' + ${question.id} + '/report'}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                신고 유형 <span class="text-danger">*</span>
                            </label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio"
                                       name="reasonCategory" value="INAPPROPRIATE" required>
                                <label class="form-check-label">욕설 / 비방</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio"
                                       name="reasonCategory" value="SPAM">
                                <label class="form-check-label">스팸 / 광고</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio"
                                       name="reasonCategory" value="WRONG_INFO">
                                <label class="form-check-label">잘못된 정보</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio"
                                       name="reasonCategory" value="ILLEGAL">
                                <label class="form-check-label">불법 내용</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio"
                                       name="reasonCategory" value="OTHER">
                                <label class="form-check-label">기타</label>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">
                                상세 사유 <span class="text-muted">(선택)</span>
                            </label>
                            <textarea name="reason" class="form-control" rows="3"
                                      placeholder="추가 설명을 입력하세요" maxlength="500"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary"
                                data-bs-dismiss="modal">취소</button>
                        <button type="submit" class="btn btn-danger">신고하기</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
