<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" th:href="@{/questions/list}">알바이브</a>

        <!-- 햄버거 버튼 -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/questions/list}"
                       th:style="${category == null} ? 'color:#ea580c !important;font-weight:600' : ''">전체</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/questions/list(category='외식/음료')}"
                       th:style="${category == '외식/음료'} ? 'color:#ea580c !important;font-weight:600' : ''">외식/음료</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/questions/list(category='유통/판매')}"
                       th:style="${category == '유통/판매'} ? 'color:#ea580c !important;font-weight:600' : ''">유통/판매</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/questions/list(category='서비스')}"
                       th:style="${category == '서비스'} ? 'color:#ea580c !important;font-weight:600' : ''">서비스</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/questions/list(category='사무/학원')}"
                       th:style="${category == '사무/학원'} ? 'color:#ea580c !important;font-weight:600' : ''">사무/학원</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/questions/list(category='생산/건설')}"
                       th:style="${category == '생산/건설'} ? 'color:#ea580c !important;font-weight:600' : ''">생산/건설</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/questions/list(category='운송/배달')}"
                       th:style="${category == '운송/배달'} ? 'color:#ea580c !important;font-weight:600' : ''">운송/배달</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/questions/list(category='기타')}"
                       th:style="${category == '기타'} ? 'color:#ea580c !important;font-weight:600' : ''">기타</a>
                </li>
            </ul>

            <ul class="navbar-nav ms-auto align-items-center">
                <!-- 비로그인 -->
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/member/login}">로그인</a>
                </li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="btn btn-primary btn-sm" th:href="@{/member/signup}">회원가입</a>
                </li>

                <!-- 로그인 후 -->
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/member/mypage}">
                        <span sec:authentication="name"></span> 님
                    </a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-secondary btn-sm">로그아웃</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

</body>
</html>
