<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" th:href="@{/questions/list}">알바이브</a>

        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/questions/list}">전체</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/questions/list(category='외식/음료')}">외식/음료</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/questions/list(category='유통/판매')}">유통/판매</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/questions/list(category='서비스')}">서비스</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/questions/list(category='사무/학원')}">사무/학원</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/questions/list(category='운송/배달')}">운송/배달</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/questions/list(category='기타')}">기타</a>
                </li>
            </ul>

            <ul class="navbar-nav ms-auto align-items-center">
                <!-- 비로그인 -->
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/member/login}">로그인</a>
                </li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="btn btn-primary btn-sm" th:href="@{/member/signup}">회원가입</a>
                </li>

                <!-- 로그인 후 -->
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/member/mypage}">
                        <span sec:authentication="name"></span> 님
                    </a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-secondary btn-sm">로그아웃</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

</body>
</html>
