<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:fragment="answerSection">

    <!-- 답변 작성 영역 -->
    <hr class="my-4">
    <h5>답변 작성</h5>

    <div th:if="${sessionMemberId == null}" class="alert alert-warning mt-2">
        답변을 작성하려면 <a th:href="@{/member/login}">로그인</a>이 필요합니다.
    </div>

    <form th:if="${sessionMemberId != null}"
          th:action="@{'/questions/' + ${questionId} + '/answers'}"
          method="post"
          class="mt-2">
        <div class="mb-3">
        <textarea name="content"
                  class="form-control"
                  rows="5"
                  placeholder="답변 내용을 입력하세요"></textarea>
            <!-- 유효성 오류 메시지 -->
            <div th:if="${answerError}" class="text-danger small mt-1"
                 th:text="${answerError}"></div>
        </div>
        <div class="text-end">
            <button type="submit" class="btn btn-primary">답변 등록</button>
        </div>
    </form>

    <!-- 채택된 답변 영역 -->
    <div th:if="${adoptedAnswer != null}" class="mt-4">
        <hr class="my-4">
        <h5><span class="text-success">✔</span> 채택된 답변</h5>
        <div class="border border-success rounded p-3">
            <div class="d-flex justify-content-between align-items-start">
                <div class="fw-semibold" th:text="${adoptedAnswer.member.nickname}">닉네임</div>
                <div class="text-muted small"
                     th:text="${#temporals.format(adoptedAnswer.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</div>
            </div>
            <div class="mt-2" style="white-space: pre-wrap;"
                 th:text="${adoptedAnswer.content}">채택된 답변 내용</div>

            <div th:if="${question.member.id == sessionMemberId}" class="mt-2 text-end">
                <form th:action="@{'/answers/' + ${adoptedAnswer.id} + '/cancel-adopt'}"
                      method="post"
                      class="d-inline"
                      onsubmit="return confirm('채택을 취소하시겠습니까?');">
                    <button type="submit" class="btn btn-sm btn-outline-secondary">채택 취소</button>
                </form>
            </div>
        </div>
    </div>

    <hr class="my-4">

    <!-- 답변 목록 -->
    <h4>답변 <span class="text-primary" th:text="${#lists.size(answers)}">0</span>개</h4>

    <p th:if="${#lists.isEmpty(answers)}" class="text-muted mt-3">답변이 없습니다.</p>

    <div th:each="answer : ${answers}" class="border rounded p-3 mb-3 mt-3">

        <div th:if="${answer.selected}" class="mb-2">
            <span class="badge bg-success">✔ 채택된 답변</span>
        </div>

        <div class="d-flex justify-content-between align-items-start">
            <div class="fw-semibold" th:text="${answer.member.nickname}">닉네임</div>
            <div class="d-flex align-items-center gap-2">
                <div class="text-muted small"
                     th:text="${#temporals.format(answer.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</div>
                <!-- 신고 버튼 추가 (타인 답변 + 로그인 시에만) -->
                <button th:if="${sessionMemberId != null and answer.member.id != sessionMemberId}"
                        type="button"
                        class="btn btn-sm btn-danger"
                        style="font-size:11px; padding: 2px 8px;"
                        th:attr="onclick='openReportModal(' + ${answer.id} + ')'">
                    신고
                </button>
            </div>
        </div>

        <div class="mt-2 answer-content" style="white-space: pre-wrap;"
             th:text="${answer.content}">답변 내용</div>

        <form th:action="@{'/answers/' + ${answer.id} + '/update'}"
              method="post"
              class="answer-edit-form mt-2"
              style="display:none;">
            <textarea name="content" class="form-control" rows="4"
                      th:text="${answer.content}"></textarea>
            <div class="mt-2 d-flex gap-2 justify-content-end">
                <button type="button" class="btn btn-sm btn-outline-secondary cancel-btn">취소</button>
                <button type="submit" class="btn btn-sm btn-primary">수정 완료</button>
            </div>
        </form>

        <div class="mt-2 d-flex gap-2 align-items-center">
            <form th:if="${question.member.id == sessionMemberId and !answer.selected}"
                  th:action="@{'/answers/' + ${answer.id} + '/adopt'}"
                  method="post"
                  class="d-inline">
                <button type="submit" class="btn btn-sm btn-outline-success">채택하기</button>
            </form>

            <div th:if="${answer.member.id == sessionMemberId}" class="d-flex gap-2">
                <button type="button" class="btn btn-sm btn-outline-primary edit-btn">수정</button>
                <form th:action="@{'/answers/' + ${answer.id} + '/delete'}"
                      method="post"
                      onsubmit="return confirm('정말 삭제하시겠습니까?');"
                      class="d-inline">
                    <button type="submit" class="btn btn-sm btn-outline-danger">삭제</button>
                </form>
            </div>
        </div>

        <!-- 대댓글 목록 -->
        <div th:if="${not #lists.isEmpty(answer.children)}"
             class="mt-3 ms-4 border-start ps-3">
            <div th:each="comment : ${answer.children}" class="mb-2">
                <div class="d-flex justify-content-between align-items-center">
    <span class="fw-semibold small"
          th:text="${comment.member.nickname}">닉네임</span>
                    <div class="d-flex align-items-center gap-2">
        <span class="text-muted small"
              th:text="${#temporals.format(comment.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</span>
                        <!-- 대댓글 신고 버튼 -->
                        <button th:if="${sessionMemberId != null and comment.member.id != sessionMemberId}"
                                type="button"
                                class="btn btn-sm btn-danger"
                                style="font-size:11px; padding: 2px 8px;"
                                th:attr="onclick='openReportModal(' + ${comment.id} + ')'">
                            신고
                        </button>
                    </div>
                </div>

                <div class="small mt-1" style="white-space: pre-wrap;"
                     th:text="${comment.content}">대댓글 내용</div>

                <div th:if="${comment.member.id == sessionMemberId}" class="mt-1">
                    <form th:action="@{'/comments/' + ${comment.id} + '/delete'}"
                          method="post"
                          onsubmit="return confirm('삭제하시겠습니까?');"
                          class="d-inline">
                        <button type="submit"
                                class="btn btn-sm btn-link text-danger p-0">삭제</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- 대댓글 버튼 (로그인 시에만) -->
        <div th:if="${sessionMemberId != null}" class="mt-2">
            <button type="button"
                    class="btn btn-sm btn-link text-secondary p-0 comment-toggle-btn"
                    th:data-answer-id="${answer.id}">
                <i class="ti ti-message"></i> 댓글
            </button>

            <!-- 대댓글 작성 폼 (기본 숨김) -->
            <div class="comment-form mt-2 ms-4" style="display:none;">
                <form th:action="@{'/answers/' + ${answer.id} + '/comments'}"
                      method="post"
                      class="d-flex gap-2">
                    <input type="text"
                           name="content"
                           class="form-control form-control-sm"
                           placeholder="댓글을 입력하세요 (5자 이상)"
                           required>
                    <button type="submit"
                            class="btn btn-sm btn-primary text-nowrap">등록</button>
                    <button type="button"
                            class="btn btn-sm btn-outline-secondary text-nowrap comment-cancel-btn">취소</button>
                </form>
            </div>
        </div>
    </div>

    <!-- 신고 모달 추가 -->
    <div class="modal fade" id="reportModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">답변 신고</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="reportForm" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                신고 유형 <span class="text-danger">*</span>
                            </label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio"
                                       name="reasonCategory" value="INAPPROPRIATE" required>
                                <label class="form-check-label">욕설 / 비방</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio"
                                       name="reasonCategory" value="SPAM">
                                <label class="form-check-label">스팸 / 광고</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio"
                                       name="reasonCategory" value="WRONG_INFO">
                                <label class="form-check-label">잘못된 정보</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio"
                                       name="reasonCategory" value="ILLEGAL">
                                <label class="form-check-label">불법 내용</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio"
                                       name="reasonCategory" value="OTHER">
                                <label class="form-check-label">기타</label>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">
                                상세 사유 <span class="text-muted">(선택)</span>
                            </label>
                            <textarea name="reason" class="form-control" rows="3"
                                      placeholder="추가 설명을 입력하세요"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary"
                                data-bs-dismiss="modal">취소</button>
                        <button type="submit" class="btn btn-danger">신고하기</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</div>

<script th:fragment="answerScript">
    document.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', function () {
            const card = this.closest('.border');
            card.querySelector('.answer-content').style.display = 'none';
            card.querySelector('.answer-edit-form').style.display = 'block';
            this.style.display = 'none';
        });
    });

    document.querySelectorAll('.cancel-btn').forEach(btn => {
        btn.addEventListener('click', function () {
            const card = this.closest('.border');
            card.querySelector('.answer-content').style.display = 'block';
            card.querySelector('.answer-edit-form').style.display = 'none';
            card.querySelector('.edit-btn').style.display = 'inline-block';
        });
    });

    // 대댓글 토글
    document.querySelectorAll('.comment-toggle-btn').forEach(btn => {
        btn.addEventListener('click', function () {
            const card = this.closest('.border');
            const form = card.querySelector('.comment-form');
            const isVisible = form.style.display === 'block';
            form.style.display = isVisible ? 'none' : 'block';
            if (!isVisible) {
                form.querySelector('input').focus();
            }
        });
    });

    document.querySelectorAll('.comment-cancel-btn').forEach(btn => {
        btn.addEventListener('click', function () {
            const form = this.closest('.comment-form');
            form.style.display = 'none';
            form.querySelector('input').value = '';
        });
    });

    // 신고 모달 열기
    function openReportModal(answerId) {
        document.getElementById('reportForm').action = '/answers/' + answerId + '/report';
        new bootstrap.Modal(document.getElementById('reportModal')).show();
    }

</script>

</body>
</html>
