<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: base(~{::content})}">
<head><title>알바이브 - 로그인</title></head>
<body>
<th:block th:fragment="content">
    <div class="container d-flex justify-content-center align-items-center" style="min-height:80vh">
        <div class="card p-5" style="width:440px">
            <h2 class="text-center fw-bold mb-1" style="color:#ea580c">알바이브</h2>
            <p class="text-center text-muted mb-4">아르바이트 Q&A 커뮤니티</p>

            <form th:action="@{/members/login}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold">아이디</label>
                    <input type="text" name="username" class="form-control" placeholder="아이디를 입력해주세요">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">비밀번호</label>
                    <input type="password" name="password" class="form-control" placeholder="비밀번호를 입력해주세요">
                </div>
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <label class="d-flex align-items-center gap-2" style="font-size:13px">
                        <input type="checkbox" name="remember-me"> 로그인 상태 유지
                    </label>
                    <a href="#" style="font-size:13px;color:#9ca3af">비밀번호 찾기</a>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">로그인</button>
            </form>

            <hr class="my-4">
            <p class="text-center text-muted" style="font-size:13px">
                계정이 없으신가요?
                <a th:href="@{/members/signup}" style="color:#ea580c;font-weight:600">회원가입</a>
            </p>
        </div>
    </div>
</th:block>
</body>
</html>
