<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: base(~{::content})}">
<head>
    <title>알바이브 - 로그인</title>
</head>
<body>
<th:block th:fragment="content">
    <div class="container d-flex justify-content-center align-items-center" style="min-height:80vh">
        <div class="card p-5" style="width:440px">
            <h2 class="text-center fw-bold mb-1" style="color:#ea580c">알바이브</h2>
            <p class="text-center text-muted mb-4">아르바이트 Q&A 커뮤니티</p>

            <div th:if="${loginErrorMsg}"
                 class="alert alert-danger text-center small py-2 mb-3"
                 role="alert"
                 th:text="${loginErrorMsg}">
                에러 메시지 출력 영역
            </div>

            <form th:action="@{/member/login}" th:object="${loginFormDto}" method="post">
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">이메일</label>
                    <input type="email" id="email" name="email"
                           class="form-control"
                           th:field="*{email}"
                           placeholder="이메일을 입력해주세요"
                           required autofocus>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">비밀번호</label>
                    <input type="password" id="password" name="password"
                           class="form-control"
                           th:field="*{password}"
                           placeholder="비밀번호를 입력해주세요"
                           required>
                </div>

                <!--
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <label class="d-flex align-items-center gap-2" style="font-size:13px">
                        <input type="checkbox" id="rememberMe" name="remember-me"> 로그인 상태 유지
                    </label>
                    <a href="#" style="font-size:13px;color:#9ca3af">비밀번호 찾기</a>
                </div>
                -->
                <button type="submit" class="btn btn-primary w-100 py-2">로그인</button>
            </form>

            <hr class="my-4">
            <p class="text-center text-muted" style="font-size:13px">
                계정이 없으신가요?
                <a th:href="@{/member/signup}" style="color:#ea580c;font-weight:600">회원가입</a>
            </p>
        </div>
    </div>
</th:block>
</body>
</html>
