<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>알바이브 - 로그인</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #F9FAFB; /* 연한 회색 배경 */
        }
        .text-orange {
            color: #EA580C !important;
        }
        .btn-orange {
            background-color: #EA580C;
            border-color: #EA580C;
            color: white;
        }
        .btn-orange:hover {
            background-color: #c24100;
            border-color: #c24100;
            color: white;
        }
        .card-custom {
            max-width: 440px; /* 피그마 가이드 반영: 440px */
            width: 100%;
            border-radius: 12px;
            border: 1px solid #E5E7EB;
        }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center vh-100">

<div class="card card-custom p-4 p-md-5 shadow-sm bg-white">

    <div class="text-center mb-4">
        <h1 class="fw-bold text-orange mb-2">알바이브</h1>
        <p class="text-muted small mb-0">아르바이트 Q&A 커뮤니티</p>
    </div>

    <div th:if="${loginErrorMsg}" class="alert alert-danger text-center small py-2 mb-3" role="alert" th:text="${loginErrorMsg}">
        에러 메시지 출력 영역
    </div>

    <form th:action="@{/member/login}" th:object="${loginFormDto}" method="post">

        <div class="mb-3">
            <label for="email" class="form-label text-secondary fw-semibold small">이메일</label>
            <input type="email" id="email" name="email"
                   class="form-control"
                   th:field="*{email}"
                   placeholder="이메일을 입력해주세요" required autofocus>
        </div>

        <div class="mb-4">
            <label for="password" class="form-label text-secondary fw-semibold small">비밀번호</label>
            <input type="password" id="password" name="password"
                   class="form-control"
                   th:field="*{password}"
                   placeholder="비밀번호를 입력해주세요" required>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4 small">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe">
                <label class="form-check-label text-secondary" for="rememberMe">
                    로그인 상태 유지
                </label>
            </div>
            <a href="#" class="text-decoration-none text-muted">비밀번호 찾기</a>
        </div>

        <button type="submit" class="btn btn-orange w-100 py-2 fw-bold fs-5 mb-4">
            로그인
        </button>

        <div class="position-relative mb-4">
            <hr class="text-muted">
            <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 text-muted small">또는</span>
        </div>

        <div class="text-center mt-2">
            <span class="text-muted small">계정이 없으신가요?</span>
            <a th:href="@{/member/signup}" class="text-orange fw-bold text-decoration-none small ms-1">회원가입</a>
        </div>

    </form>
</div>

</body>
</html>
