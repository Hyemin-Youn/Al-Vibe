<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:replace="~{layout/base :: base(~{::content})}">
<head><title>알바이브 - 마이페이지</title></head>
<body>
<th:block th:fragment="content">
    <div class="container py-4">
        <div class="row">
            <!-- 왼쪽 -->
            <div class="col-8">
                <div class="card mb-3">
                    <div class="card-body">
                        <div class="d-flex align-items-center gap-3 mb-4">
                            <div class="rounded-circle d-flex align-items-center justify-content-center fw-bold"
                                 style="width:56px;height:56px;background:#fed7aa;color:#c2410c;font-size:20px">
                                닉
                            </div>
                            <div>
                                <div class="fw-bold fs-5">닉네임</div>
                                <div class="text-muted" style="font-size:13px">email@email.com</div>
                                <div class="text-muted" style="font-size:12px">가입일 2026.05.07</div>
                            </div>
                        </div>
                        <div class="row text-center g-2">
                            <div class="col-4">
                                <div class="bg-light rounded p-3">
                                    <div class="fw-bold fs-4" style="color:#ea580c">0</div>
                                    <div class="text-muted" style="font-size:12px">작성 질문</div>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="bg-light rounded p-3">
                                    <div class="fw-bold fs-4" style="color:#ea580c">0</div>
                                    <div class="text-muted" style="font-size:12px">작성 답변</div>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="bg-light rounded p-3">
                                    <div class="fw-bold fs-4" style="color:#ea580c">0</div>
                                    <div class="text-muted" style="font-size:12px">답변 채택</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header bg-white">
                        <ul class="nav nav-tabs card-header-tabs">
                            <li class="nav-item">
                                <a class="nav-link active" href="#">내 질문</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link text-muted" href="#">내 답변</a>
                            </li>
                        </ul>
                    </div>
                    <div class="card-body">
                        <p class="text-muted text-center py-4">작성한 질문이 없습니다.</p>
                    </div>
                </div>
            </div>

            <!-- 오른쪽 -->
            <div class="col-4">
                <div class="card p-4 mb-3">
                    <h6 class="fw-bold mb-3">내 정보 수정</h6>
                    <div class="mb-3">
                        <label class="form-label" style="font-size:13px">닉네임</label>
                        <input type="text" class="form-control form-control-sm">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" style="font-size:13px">이메일</label>
                        <input type="email" class="form-control form-control-sm">
                    </div>
                    <button class="btn btn-primary btn-sm w-100">저장하기</button>
                </div>

                <div class="card p-4 mb-3">
                    <h6 class="fw-bold mb-3">비밀번호 변경</h6>
                    <div class="mb-3">
                        <label class="form-label" style="font-size:13px">현재 비밀번호</label>
                        <input type="password" class="form-control form-control-sm">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" style="font-size:13px">새 비밀번호</label>
                        <input type="password" class="form-control form-control-sm">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" style="font-size:13px">새 비밀번호 확인</label>
                        <input type="password" class="form-control form-control-sm">
                    </div>
                    <button class="btn btn-primary btn-sm w-100">변경하기</button>
                </div>

                <div class="card p-4" style="border-color:#fca5a5">
                    <h6 class="fw-bold mb-2" style="color:#dc2626">위험 구역</h6>
                    <p class="text-muted mb-3" style="font-size:12px">탈퇴 시 계정 복구가 불가능합니다.</p>
                    <button class="btn btn-sm w-100" style="color:#dc2626;border-color:#fca5a5">회원 탈퇴</button>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
