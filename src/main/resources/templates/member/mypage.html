<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:replace="~{layout/base :: base(~{::content})}">
<head><title>알바이브 - 마이페이지</title></head>
<body>
<th:block th:fragment="content">
    <div class="container py-4">
        <div class="row">
            <div class="col-8">
                <div class="card mb-3">
                    <div class="card-body">
                        <div class="d-flex align-items-center gap-3 mb-4">
                            <div class="rounded-circle d-flex align-items-center justify-content-center fw-bold"
                                 style="width:56px;height:56px;background:#fed7aa;color:#c2410c;font-size:20px"
                                 th:text="${#strings.substring(myPageProfileDto.nickname, 0, 1)}">
                                닉
                            </div>
                            <div>
                                <div class="fw-bold fs-5" th:text="${myPageProfileDto.nickname}">닉네임</div>
                                <div class="text-muted" style="font-size:13px" th:text="${myPageProfileDto.email}">
                                    email@email.com
                                </div>
                                <div class="text-muted" style="font-size:12px"
                                     th:text="|가입일 ${#temporals.format(myPageProfileDto.createAt, 'yyyy.MM.dd')}|">가입일
                                    2026.05.07
                                </div>
                            </div>
                        </div>
                        <div class="row text-center g-2">
                            <div class="col-4">
                                <div class="bg-light rounded p-3">
                                    <div class="fw-bold fs-4" style="color:#ea580c" th:text="${questionCount}">0</div>
                                    <div class="text-muted" style="font-size:12px">작성 질문</div>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="bg-light rounded p-3">
                                    <div class="fw-bold fs-4" style="color:#ea580c" th:text="${answerCount}">0</div>
                                    <div class="text-muted" style="font-size:12px">작성 답변</div>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="bg-light rounded p-3">
                                    <div class="fw-bold fs-4" style="color:#ea580c" th:text="${adoptedCount}">0</div>
                                    <div class="text-muted" style="font-size:12px">답변 채택</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header bg-white">
                        <ul class="nav nav-tabs card-header-tabs" id="myTab" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active fw-bold" id="question-tab" data-bs-toggle="tab" data-bs-target="#question-pane" type="button" role="tab" aria-controls="question-pane" aria-selected="true" style="color:#ea580c;">내 질문</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link text-muted" id="answer-tab" data-bs-toggle="tab" data-bs-target="#answer-pane" type="button" role="tab" aria-controls="answer-pane" aria-selected="false">내 답변</button>
                            </li>
                        </ul>
                    </div>

                    <div class="card-body p-0 tab-content" id="myTabContent">

                        <div class="tab-pane fade show active" id="question-pane" role="tabpanel" aria-labelledby="question-tab" tabindex="0">
                            <p th:if="${#lists.isEmpty(myQuestions)}" class="text-muted text-center py-5 mb-0">작성한 질문이 없습니다.</p>

                            <div class="list-group list-group-flush" th:unless="${#lists.isEmpty(myQuestions)}">
                                <div th:each="q : ${myQuestions}" th:href="@{|/questions/${q.id}|}" class="list-group-item py-3">
                                    <div class="d-flex justify-content-between align-items-center mb-1">
                                        <h6 class="mb-0 fw-bold text-truncate" style="max-width: 80%;" th:text="${q.title}">질문 제목</h6>
                                        <small class="text-muted" th:text="${#temporals.format(q.createdAt, 'yyyy.MM.dd')}">날짜</small>
                                    </div>
                                    <div class="text-muted" style="font-size: 13px;">
                                        조회수 <span th:text="${q.viewCount}">0</span> · 답변 <span th:text="${q.answerCount}">0</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="tab-pane fade" id="answer-pane" role="tabpanel" aria-labelledby="answer-tab" tabindex="0">
                            <p th:if="${#lists.isEmpty(myAnswers)}" class="text-muted text-center py-5 mb-0">작성한 답변이 없습니다.</p>

                            <div class="list-group list-group-flush" th:unless="${#lists.isEmpty(myAnswers)}">
                                <div th:each="a : ${myAnswers}" th:href="@{|/questions/${a.question.id}|}" class="list-group-item py-3">
                                    <div class="d-flex justify-content-between align-items-center mb-1">
                                        <div class="text-truncate text-dark" style="max-width: 75%; font-size: 15px;" th:text="${a.content}">답변 내용</div>
                                        <small class="text-muted" th:text="${#temporals.format(a.createdAt, 'yyyy.MM.dd')}">날짜</small>
                                    </div>
                                    <div class="text-muted d-flex align-items-center" style="font-size: 13px;">
                                        <span class="text-truncate d-inline-block" style="max-width: 80%;">원문: [[${a.question.title}]]</span>
                                        <span th:if="${a.isSelected}" class="badge bg-success ms-2" style="font-size:11px;">채택됨</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

            <div class="col-4">
                <div class="accordion shadow-sm" id="myPageAccordion">

                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button fw-bold" type="button" data-bs-toggle="collapse"
                                    data-bs-target="#collapseEditInfo">
                                📝 내 정보 수정
                            </button>
                        </h2>
                        <div id="collapseEditInfo" class="accordion-collapse collapse show"
                             data-bs-parent="#myPageAccordion">
                            <div class="accordion-body">
                                <form th:action="@{/member/mypage/info}" th:object="${updateMyInfoRequestDto}"
                                      method="post">
                                    <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger py-2"
                                         style="font-size:12px;">
                                        <p class="mb-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label" style="font-size:13px">닉네임</label>
                                        <input type="text" th:field="*{nickname}" class="form-control form-control-sm"
                                               th:classappend="${#fields.hasErrors('nickname')} ? 'is-invalid' : ''">
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('nickname')}"
                                             th:errors="*{nickname}"></div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label" style="font-size:13px">이메일</label>
                                        <input type="email" th:field="*{email}" class="form-control form-control-sm"
                                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                                             th:errors="*{email}"></div>
                                    </div>
                                    <button type="submit" class="btn btn-primary btn-sm w-100">저장하기</button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed fw-bold" type="button" data-bs-toggle="collapse"
                                    data-bs-target="#collapsePassword">
                                🔒 비밀번호 변경
                            </button>
                        </h2>
                        <div id="collapsePassword" class="accordion-collapse collapse"
                             data-bs-parent="#myPageAccordion">
                            <div class="accordion-body">
                                <form th:action="@{/member/mypage/password}" th:object="${changePasswordRequestDto}"
                                      method="post">
                                    <div class="mb-3">
                                        <label class="form-label" style="font-size:13px">현재 비밀번호</label>
                                        <input type="password" th:field="*{password}"
                                               class="form-control form-control-sm"
                                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''">
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}"
                                             th:errors="*{password}"></div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label" style="font-size:13px">새 비밀번호</label>
                                        <input type="password" th:field="*{newPassword}"
                                               class="form-control form-control-sm"
                                               th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid' : ''">
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('newPassword')}"
                                             th:errors="*{newPassword}"></div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label" style="font-size:13px">새 비밀번호 확인</label>
                                        <input type="password" th:field="*{newPasswordConfirm}"
                                               class="form-control form-control-sm"
                                               th:classappend="${#fields.hasErrors('newPasswordConfirm')} ? 'is-invalid' : ''">
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('newPasswordConfirm')}"
                                             th:errors="*{newPasswordConfirm}"></div>
                                    </div>
                                    <button type="submit" class="btn btn-primary btn-sm w-100">변경하기</button>
                                </form>
                            </div>
                        </div>
                    </div>
                    <!--
                    <div class="accordion-item" style="border-color:#fca5a5">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed fw-bold" style="color:#dc2626;" type="button"
                                    data-bs-toggle="collapse" data-bs-target="#collapseDanger">
                                ⚠️ 회원 탈퇴
                            </button>
                        </h2>
                        <div id="collapseDanger" class="accordion-collapse collapse" data-bs-parent="#myPageAccordion">
                            <div class="accordion-body">
                                <h6 class="fw-bold mb-2" style="color:#dc2626">위험 구역</h6>
                                <p class="text-muted mb-3" style="font-size:12px">탈퇴 시 계정 복구가 불가능합니다.</p>
                                <button type="button" class="btn btn-sm w-100"
                                        style="color:#dc2626;border-color:#fca5a5">회원 탈퇴
                                </button>
                            </div>
                        </div>
                    </div>
                    -->
                </div>
            </div>
            <script>
                document.addEventListener("DOMContentLoaded", function () {
                    const errorInputs = document.querySelectorAll('.is-invalid, .alert-danger');

                    errorInputs.forEach(function (input) {
                        const collapseDiv = input.closest('.accordion-collapse');
                        if (collapseDiv) {
                            const bsCollapse = new bootstrap.Collapse(collapseDiv, {toggle: false});
                            bsCollapse.show(); // 이거 하나만 열리면 부트스트랩이 알아서 나머지는 닫아줍니다!
                        }
                    });
                });
            </script>
        </div>
    </div>
    </div>
</th:block>
</body>
</html>
