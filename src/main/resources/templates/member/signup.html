<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: base(~{::content})}">
<head><title>알바이브 - 회원가입</title></head>
<body>
<th:block th:fragment="content">
    <div class="container d-flex justify-content-center py-5">
        <div class="card p-5" style="width:480px">
            <h4 class="fw-bold mb-1">회원가입</h4>
            <p class="text-muted mb-4" style="font-size:13px">알바이브와 함께 시작해보세요</p>

            <form th:action="@{/members/signup}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold">아이디 <span style="color:#ea580c">*</span></label>
                    <div class="d-flex gap-2">
                        <input type="text" name="username" class="form-control" placeholder="영문, 숫자 4~20자">
                        <button type="button" class="btn btn-outline-secondary btn-sm" style="white-space:nowrap">중복 확인</button>
                    </div>
                    <div class="form-text">영문 소문자, 숫자만 사용 가능합니다.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">비밀번호 <span style="color:#ea580c">*</span></label>
                    <input type="password" name="password" class="form-control" placeholder="8자 이상, 영문+숫자+특수문자">
                    <div class="form-text">8자 이상, 영문, 숫자, 특수문자를 포함해야 합니다.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">비밀번호 확인 <span style="color:#ea580c">*</span></label>
                    <input type="password" name="passwordConfirm" class="form-control" placeholder="비밀번호를 다시 입력해주세요">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">닉네임 <span style="color:#ea580c">*</span></label>
                    <div class="d-flex gap-2">
                        <input type="text" name="nickname" class="form-control" placeholder="2~10자">
                        <button type="button" class="btn btn-outline-secondary btn-sm" style="white-space:nowrap">중복 확인</button>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">이메일 <span style="color:#ea580c">*</span></label>
                    <input type="email" name="email" class="form-control" placeholder="example@email.com">
                </div>

                <div class="border rounded p-3 mb-4" style="font-size:13px">
                    <label class="d-flex align-items-center gap-2 fw-bold mb-2">
                        <input type="checkbox"> 전체 동의
                    </label>
                    <hr class="my-2">
                    <label class="d-flex align-items-center gap-2 mb-2">
                        <input type="checkbox" name="termsAgree"> [필수] 이용약관에 동의합니다
                    </label>
                    <label class="d-flex align-items-center gap-2 mb-2">
                        <input type="checkbox" name="privacyAgree"> [필수] 개인정보 수집 및 이용에 동의합니다
                    </label>
                    <label class="d-flex align-items-center gap-2">
                        <input type="checkbox" name="marketingAgree"> [선택] 마케팅 정보 수신에 동의합니다
                    </label>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2">가입하기</button>
            </form>

            <p class="text-center text-muted mt-3" style="font-size:13px">
                이미 계정이 있으신가요?
                <a th:href="@{/members/login}" style="color:#ea580c;font-weight:600">로그인</a>
            </p>
        </div>
    </div>
</th:block>
</body>
</html>
