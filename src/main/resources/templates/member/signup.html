<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>알바이브 - 회원가입</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #F9FAFB; /* 연한 회색 배경 */
        }
        .text-orange {
            color: #EA580C !important;
        }
        .btn-orange {
            background-color: #EA580C;
            border-color: #EA580C;
            color: white;
        }
        .btn-orange:hover {
            background-color: #c24100;
            border-color: #c24100;
            color: white;
        }
        .card-custom {
            max-width: 480px;
            width: 100%;
            border-radius: 12px;
            border: 1px solid #E5E7EB;
        }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center vh-100">

<div class="card card-custom p-4 p-md-5 shadow-sm bg-white">

    <div class="text-center mb-4">
        <h1 class="fw-bold text-orange mb-2">알바이브</h1>
        <h4 class="fw-bold text-dark">회원가입</h4>
        <p class="text-muted small">아르바이트 Q&A 커뮤니티</p>
    </div>

    <form th:action="@{/member/signup}" th:object="${memberSignupDto}" method="post">

        <div class="mb-3">
            <label for="email" class="form-label text-secondary fw-semibold small">이메일</label>
            <input type="email" id="email"
                   class="form-control"
                   th:field="*{email}"
                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                   placeholder="example@alvibe.com">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label text-secondary fw-semibold small">비밀번호</label>
            <input type="password" id="password"
                   class="form-control"
                   th:field="*{password}"
                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                   placeholder="최소 4자 이상 입력해주세요">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>

        <div class="mb-3">
            <label for="passwordConfirm" class="form-label text-secondary fw-semibold small">비밀번호 확인</label>
            <input type="password" id="passwordConfirm"
                   class="form-control"
                   th:field="*{passwordConfirm}"
                   th:classappend="${#fields.hasErrors('passwordConfirm') || #fields.hasErrors('validPassword')} ? 'is-invalid' : ''"
                   placeholder="비밀번호를 다시 입력해주세요">

            <div class="invalid-feedback" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}"></div>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('validPassword')}" th:errors="*{validPassword}"></div>
        </div>

        <div class="mb-4">
            <label for="nickname" class="form-label text-secondary fw-semibold small">닉네임</label>
            <input type="text" id="nickname"
                   class="form-control"
                   th:field="*{nickname}"
                   th:classappend="${#fields.hasErrors('nickname')} ? 'is-invalid' : ''"
                   placeholder="2자~10자 사이로 작성해주세요">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}"></div>
        </div>

        <button type="submit" class="btn btn-orange w-100 py-2 fw-bold mb-3 fs-5">
            가입하기
        </button>

        <div class="text-center mt-2">
            <span class="text-muted small">이미 계정이 있으신가요?</span>
            <a th:href="@{/member/login}" class="text-orange fw-bold text-decoration-none small ms-1">로그인</a>
        </div>

    </form>
</div>

</body>
</html>
