<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: base(~{::content})}">
<head>
    <title>알바이브 - 회원가입</title>
</head>
<body>
<th:block th:fragment="content">
    <div class="container d-flex justify-content-center py-5">
        <div class="card p-5" style="width:480px">
            <h4 class="fw-bold mb-1">회원가입</h4>
            <p class="text-muted mb-4" style="font-size:13px">알바이브와 함께 시작해보세요</p>

            <form th:action="@{/member/signup}" th:object="${memberSignupDto}" method="post">

                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">
                        이메일 <span style="color:#ea580c">*</span>
                    </label>
                    <input type="email" id="email"
                           class="form-control"
                           th:field="*{email}"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                           placeholder="example@alvibe.com">
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('email')}"
                         th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">
                        비밀번호 <span style="color:#ea580c">*</span>
                    </label>
                    <input type="password" id="password"
                           class="form-control"
                           th:field="*{password}"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                           placeholder="영문과 숫자만 포함 8자 이상">
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('password')}"
                         th:errors="*{password}"></div>
                </div>

                <div class="mb-3">
                    <label for="passwordConfirm" class="form-label fw-semibold">
                        비밀번호 확인 <span style="color:#ea580c">*</span>
                    </label>
                    <input type="password" id="passwordConfirm"
                           class="form-control"
                           th:field="*{passwordConfirm}"
                           th:classappend="${#fields.hasErrors('passwordConfirm') || #fields.hasErrors('validPassword')} ? 'is-invalid' : ''"
                           placeholder="비밀번호를 다시 입력해주세요">
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('passwordConfirm')}"
                         th:errors="*{passwordConfirm}"></div>
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('validPassword')}"
                         th:errors="*{validPassword}"></div>
                </div>

                <div class="mb-3">
                    <label for="nickname" class="form-label fw-semibold">
                        닉네임 <span style="color:#ea580c">*</span>
                    </label>
                    <input type="text" id="nickname"
                           class="form-control"
                           th:field="*{nickname}"
                           th:classappend="${#fields.hasErrors('nickname')} ? 'is-invalid' : ''"
                           placeholder="2자~10자 사이로 작성해주세요">
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('nickname')}"
                         th:errors="*{nickname}"></div>
                </div>
                <!--
                <div class="border rounded p-3 mb-4" style="font-size:13px">
                    <label class="d-flex align-items-center gap-2 fw-bold mb-2">
                        <input type="checkbox"> 전체 동의
                    </label>
                    <hr class="my-2">
                    <label class="d-flex align-items-center gap-2 mb-2">
                        <input type="checkbox" name="termsAgree"> [필수] 이용약관에 동의합니다
                    </label>
                    <label class="d-flex align-items-center gap-2 mb-2">
                        <input type="checkbox" name="privacyAgree"> [필수] 개인정보 수집 및 이용에 동의합니다
                    </label>
                    <label class="d-flex align-items-center gap-2">
                        <input type="checkbox" name="marketingAgree"> [선택] 마케팅 정보 수신에 동의합니다
                    </label>
                </div>
                -->

                <button type="submit" class="btn btn-primary w-100 py-2">가입하기</button>
            </form>

            <p class="text-center text-muted mt-3" style="font-size:13px">
                이미 계정이 있으신가요?
                <a th:href="@{/member/login}" style="color:#ea580c;font-weight:600">로그인</a>
            </p>
        </div>
    </div>
</th:block>
</body>
</html>
